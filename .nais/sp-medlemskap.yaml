apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sp-medlemskap
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  startup:
    path: isready
    initialDelay: 20
    periodSeconds: 5
    failureThreshold: 9
  liveness:
    path: isalive
  readiness:
    path: isready
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  leaderElection: true
  replicas:
    min: 4
    max: 4
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
  azure:
    application:
      enabled: true
      claims:
        extra:
          - NAVident
  valkey:
    - instance: personpseudoid
      access: read
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-sp-medlemskap-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: TILGANGSMASKINEN_BASE_URL
      value: http://populasjonstilgangskontroll.tilgangsmaskin
  accessPolicy:
    inbound:
      rules:
        - application: speil
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: populasjonstilgangskontroll
          namespace: tilgangsmaskin
        - application: spleis-api
